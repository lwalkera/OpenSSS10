#
# OpenOCD target config for the FMD FT32F030x6/x8 (an STM32F030 clone).
#
#   openocd -f interface/cmsis-dap.cfg -f openocd/ft32f0x.cfg
#
# Based on target/stm32f0x.cfg, fixing where the FT32 differs:
#
# 1. DBGMCU (0x40015800) has its own clock, RCC_APB2ENR.DBGMCUEN (bit 22);
#    without it DBGMCU_IDCODE reads 0 (with it: 0x20006448, i.e. the STM32F07x
#    device ID).
#
#    The freeze registers DBGMCU_APB1_FZ/APB2_FZ only accept writes while the
#    core is halted and read 0 once it runs. Do NOT set DBG_IWDG_STOP: the RM
#    (22.3.3) says it enables a hardware watchdog on this part, and the one
#    test with it set while halted ended with the debug port dead after
#    ~0.5 s. So the IWDG keeps running while the core is halted. This config
#    refreshes it on every halt and during flash operations; don't leave a
#    core halted for more than a few seconds when the firmware has started
#    the IWDG (both the stock firmware and ours do).
#
# 2. SWD needs a solid ground between probe and board: with a weak one this
#    board showed "cannot read IDR" outages of up to a minute and garbled
#    DPIDRs. Lower the clock with FT32_SWD_KHZ if the wiring is long.
#
# 3. Flash has 512-byte pages and is programmed a 32-bit word at a time.
#    OpenOCD's stm32f1x driver identifies the part from DBGMCU_IDCODE and
#    would use STM32F0 page sizes (1 KB+), erasing only half of each page.
#    No flash bank is declared; use the ft32_* commands below instead of
#    `flash write_image`/`program`.
#
# `reset`, `reset halt` and `reset run` work normally (SYSRESETREQ).
#
# Flash commands (the core must be halted, e.g. after `reset halt`):
#   ft32_flash_write_bin <file.bin> <address>   erase, program and verify
#   ft32_flash_erase <start> <end>              erase whole pages in [start, end)

transport select swd

source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ft32f0x
}

# Work area for OpenOCD algorithms (verify_image). The flash commands stage
# data just above it.
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x1000
}

# Same Cortex-M0 SW-DP ID as the STM32F0
if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x0bb11477
}

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# SWD clock in kHz. Lower it (-c "set FT32_SWD_KHZ 100" before the -f) if
# the wiring is long or noisy: a corrupted DPIDR or "cannot read IDR" while
# the core is known to be running points at the link, not the chip.
if { [info exists FT32_SWD_KHZ] } {
	adapter speed $FT32_SWD_KHZ
} else {
	adapter speed 1000
}

adapter srst delay 100
reset_config srst_nogate
if {![using_hla]} {
	cortex_m reset_config sysresetreq
}

proc ft32f0x_examine_end {} {
	mmw 0x40021018 0x00400000 0 ;# RCC_APB2ENR |= DBGMCUEN
	mmw 0x40015804 0x00000006 0 ;# DBGMCU_CR |= DBG_STANDBY | DBG_STOP
}

# Refresh the IWDG (harmless if it isn't running). IWDG_KR writes must be
# at least 3 LSI cycles (~75 us) apart; separate debugger commands are.
proc ft32_kick_watchdog {} {
	mww 0x40003000 0x0000AAAA
}

# A halt starts with a full watchdog period (~10 s with the firmware's setup)
proc ft32f0x_halted {} {
	ft32_kick_watchdog
}

$_TARGETNAME configure -event examine-end { ft32f0x_examine_end }
$_TARGETNAME configure -event halted { ft32f0x_halted }

# ---------------------------------------------------------------------------
# Flash

set FT32_FLASH_BASE  0x08000000
set FT32_FLASH_END   0x08010000
set FT32_PAGE_SIZE   512
set FT32_STAGE_BUF   [expr {0x20000000 + $_WORKAREASIZE}]
set FT32_STAGE_SIZE  0x800

set FLASH_ACR   0x40022000
set FLASH_KEYR  0x40022004
set FLASH_SR    0x4002200C
set FLASH_CR    0x40022010
set FLASH_AR    0x40022014

set SR_BSY      0x01
set SR_PGERR    0x04
set SR_WRPRTERR 0x10
set SR_EOP      0x20
set CR_PG       0x01
set CR_PER      0x02
set CR_STRT     0x40
set CR_LOCK     0x80
set ACR_PRFTBE  0x10

proc ft32_require_halted {} {
	if {[[target current] curstate] ne "halted"} {
		return -code error "halt the core first ('halt')"
	}
}

proc ft32_wait_idle {} {
	global FLASH_SR SR_BSY
	for {set i 0} {$i < 1000} {incr i} {
		if {!([mrw $FLASH_SR] & $SR_BSY)} {
			return
		}
	}
	return -code error "flash stayed busy"
}

# Report and clear PGERR / WRPRTERR / EOP
proc ft32_check_sr {what} {
	global FLASH_SR SR_PGERR SR_WRPRTERR SR_EOP
	set sr [mrw $FLASH_SR]
	mww $FLASH_SR [expr {$SR_PGERR | $SR_WRPRTERR | $SR_EOP}]
	if {$sr & $SR_WRPRTERR} {
		return -code error "$what: write-protected"
	}
	if {$sr & $SR_PGERR} {
		return -code error "$what: programming error (location not erased?)"
	}
}

# Unlock FLASH_CR and turn the prefetch buffer off, as the vendor driver does
proc ft32_flash_begin {} {
	global FLASH_CR FLASH_KEYR FLASH_ACR CR_LOCK ACR_PRFTBE
	ft32_require_halted
	ft32_wait_idle
	if {[mrw $FLASH_CR] & $CR_LOCK} {
		mww $FLASH_KEYR 0x45670123
		mww $FLASH_KEYR 0xCDEF89AB
	}
	if {[mrw $FLASH_CR] & $CR_LOCK} {
		return -code error "flash did not unlock"
	}
	mmw $FLASH_ACR 0 $ACR_PRFTBE
}

proc ft32_flash_end {} {
	global FLASH_CR FLASH_ACR CR_LOCK ACR_PRFTBE
	mww $FLASH_CR $CR_LOCK
	mmw $FLASH_ACR $ACR_PRFTBE 0
}

proc ft32_erase_page {addr} {
	global FLASH_CR FLASH_AR CR_PER CR_STRT
	ft32_wait_idle
	mww $FLASH_CR $CR_PER
	mww $FLASH_AR $addr
	mww $FLASH_CR [expr {$CR_PER | $CR_STRT}]
	ft32_wait_idle
	mww $FLASH_CR 0
	ft32_check_sr [format "erase 0x%08x" $addr]
}

proc ft32_check_range {start end} {
	global FT32_FLASH_BASE FT32_FLASH_END FT32_PAGE_SIZE
	if {$start < $FT32_FLASH_BASE || $end > $FT32_FLASH_END || $start >= $end} {
		return -code error [format "range 0x%08x-0x%08x is outside flash" $start $end]
	}
	if {$start % $FT32_PAGE_SIZE} {
		return -code error [format "0x%08x is not page (%d-byte) aligned" $start $FT32_PAGE_SIZE]
	}
}

proc ft32_flash_erase {start end} {
	global FT32_PAGE_SIZE
	ft32_check_range $start $end
	ft32_flash_begin
	set err [catch {
		for {set a $start} {$a < $end} {incr a $FT32_PAGE_SIZE} {
			ft32_erase_page $a
			ft32_kick_watchdog
		}
	} msg]
	ft32_flash_end
	if {$err} {
		return -code error $msg
	}
	echo [format "erased 0x%08x-0x%08x" $start [expr {$start + (($end - $start + $FT32_PAGE_SIZE - 1) / $FT32_PAGE_SIZE) * $FT32_PAGE_SIZE}]]
}

# Program a raw binary. Pages covering the image are erased first; the image
# is staged through SRAM in chunks and written a 32-bit word at a time
# (each takes ~25 us, less than one SWD word transfer), then verified.
proc ft32_flash_write_bin {file addr} {
	global FT32_PAGE_SIZE FT32_STAGE_BUF FT32_STAGE_SIZE FLASH_CR CR_PG
	set size [file size $file]
	if {$size == 0} {
		return -code error "$file is empty"
	}
	set end [expr {$addr + $size}]
	ft32_check_range $addr $end
	ft32_flash_erase $addr $end

	# Pad to whole words with 0xFF (erased value)
	set words [expr {($size + 3) / 4}]
	ft32_flash_begin
	set err [catch {
		for {set off 0} {$off < $words * 4} {incr off $FT32_STAGE_SIZE} {
			set n [expr {$words * 4 - $off}]
			if {$n > $FT32_STAGE_SIZE} {
				set n $FT32_STAGE_SIZE
			}
			mww $FT32_STAGE_BUF 0xFFFFFFFF [expr {$n / 4}]
			load_image $file [expr {$FT32_STAGE_BUF - $off}] bin $FT32_STAGE_BUF $n
			set data [read_memory $FT32_STAGE_BUF 32 [expr {$n / 4}]]
			ft32_wait_idle
			mww $FLASH_CR $CR_PG
			write_memory [expr {$addr + $off}] 32 $data
			ft32_wait_idle
			mww $FLASH_CR 0
			ft32_check_sr [format "program 0x%08x" [expr {$addr + $off}]]
			ft32_kick_watchdog
		}
	} msg]
	ft32_flash_end
	if {$err} {
		return -code error $msg
	}
	echo [format "programmed %d bytes at 0x%08x" $size $addr]
	ft32_kick_watchdog
	verify_image $file $addr bin
}

# Keep OpenOCD from echoing the last proc name when loading this file
set _ft32f0x_cfg_loaded ""
